# Settings for the uncertainty system, priority and zones (scripts/12 and 13).
# EVERY number here is an ASSUMPTION fixed in advance. Script 13 tests whether the resulting tiers carry information;
# thresholds are NOT tuned on that test.
seed: 42
members:
  models: [logreg, rf, xgb]
  feature_sets: [scale_2p5km, scale_5km]   # both windows: we do not pick one (selection optimism)
  background_draws: 3                      # different random background samples per member
  background_ratio: 20
  exclusion_buffer_km: 1.0
  rf: {trees: 300, max_depth: 6, min_samples_leaf: 5}
  xgb: {n_estimators: 200, max_depth: 3, learning_rate: 0.05, subsample: 0.8, colsample_bytree: 0.8, min_child_weight: 3}
primary_model: {name: logreg, feature_set: scale_5km}    # used for the per-cell 'why' contributions
applicability:                             # adaptation of Meyer & Pebesma (2021), against the KNOWN-RECORD conditions
  feature_set: scale_5km
  threshold_block_km: 10                   # nearest other record must lie in a different 10 km block (mimics their CV exclusion)
  whisker: 1.5
quality:
  dense_veg_window_km: 5
  min_quality: 0.7                         # at most 30% densely vegetated within 5 km
tiers:
  agreement_rule: "spread <= median spread of the predicted cells"
  highest_tier_without_independent_evidence: Medium   # 'High' stays unused until geology / independent evidence exists
priority:
  # Weights for proximity vs features follow demonstrated skill above chance (0.73-0.5 : 0.66-0.5 = 0.23 : 0.16 ~ 0.6 : 0.4)
  # applied to the two evidence parts (0.7 of the total); confidence and quality are small supporting terms (assumption).
  weights: {prospectivity: 0.28, proximity: 0.42, confidence: 0.15, quality: 0.15}
  confidence_value: {Medium: 1.0, Low: 0.5, "Not assessed": 0.0}
  top_fraction_high: 0.05
  top_fraction_medium: 0.20
  sensitivity_draws: 200
  dirichlet_concentration: 20
zones: {min_cells: 8}                     # 8 cells = 0.5 km2
stepout:                                  # NEW-AREA candidates: features-only ranking, away from known records
  min_distance_km: 5.0                    # = radius of the 5 km feature window: farther cells' windows contain no known-record cell
  top_fraction: 0.05                      # top 5% of the eligible (far, Medium-confidence) cells
  min_cells: 8
validation:                               # script 13
  block_km: [20, 30]
  repeats: 3
  folds: 5
  belt_ring_km: 15
  min_test_positives: 3
  min_tier_positives: 3
